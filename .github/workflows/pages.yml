# Publishes the static demo in docs/ to GitHub Pages:
# https://swapnil007-curious.github.io/KANVAS/
# docs/model.json and docs/examples.json are built locally by scripts/export_web.py and committed;
# this workflow only uploads the folder.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
